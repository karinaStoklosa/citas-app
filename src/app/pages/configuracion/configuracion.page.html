<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Configuraciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <ion-list>
    <ion-item>
      <ion-label>Permitir eliminar citas en el inicio</ion-label>

      <ion-toggle
        slot="end"
        [(ngModel)]="permitirEliminar">
      </ion-toggle>
    </ion-item>
  </ion-list>

</ion-content>
